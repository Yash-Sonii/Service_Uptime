<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service Uptime Monitor</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
  h1 { font-weight: 600; }
  .card { background: #1e293b; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
  .dot { height: 14px; width: 14px; border-radius: 50%; display: inline-block; margin-right: 10px; }
  .up { background: #22c55e; }
  .down { background: #ef4444; }
  .meta { color: #94a3b8; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>Service Uptime Monitor</h1>
  <div id="services"></div>

  <script>
    async function refresh() {
      const res = await fetch('/status');
      const data = await res.json();
      const container = document.getElementById('services');
      container.innerHTML = '';
      data.forEach(service => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="dot ${service.up ? 'up' : 'down'}"></span>
            <strong>${service.name}</strong>
          </div>
          <div class="meta">
            ${service.up ? 'Up' : 'Down'} · ${service.response_ms} ms · checked at ${service.checked_at}
          </div>`;
        container.appendChild(card);
      });
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
