name: Build and Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t uptime-monitor:latest .

      - name: Run container
        run: docker run -d -p 5000:5000 --name uptime-monitor uptime-monitor:latest

      - name: Wait for app to start
        run: sleep 5

      - name: Check /health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker stop uptime-monitor

  